<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="sch01l-title" font-family="Inter, system-ui, sans-serif">
  <title id="sch01l-title">Schéma : sur un même réseau local, l'appareil d'un tiers répond « c'est moi la box » ; votre téléphone lui envoie alors son trafic, qu'il relaie vers la vraie box.</title>
  <!-- Pilote de direction artistique (docs/seo/ART_DIRECTION.md), variante large (≥ 480 px). Non publié. -->
  <defs>
    <marker id="l-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <marker id="l-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="8" y="8" width="624" height="264" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="28" y="38" font-size="14" font-weight="600" fill="#475569">Même réseau local : Wi-Fi d'une maison, d'un café, d'un bureau</text>

  <rect x="28" y="70" width="168" height="92" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <rect x="96" y="82" width="32" height="48" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="112" cy="122" r="2.5" fill="#2563eb"/>
  <text x="112" y="150" font-size="15" font-weight="600" fill="#0b1220" text-anchor="middle">Votre téléphone</text>

  <rect x="444" y="70" width="168" height="92" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <rect x="498" y="96" width="60" height="26" rx="5" fill="none" stroke="#0f766e" stroke-width="2"/><circle cx="512" cy="109" r="3" fill="#0f766e"/>
  <line x1="508" y1="96" x2="502" y2="84" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><line x1="548" y1="96" x2="554" y2="84" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
  <text x="528" y="150" font-size="15" font-weight="600" fill="#0b1220" text-anchor="middle">La vraie box</text>

  <path d="M200 92 L440 92" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#l-grey)" fill="none"/>
  <text x="320" y="82" font-size="13" fill="#475569" text-anchor="middle">Trajet prévu</text>

  <rect x="226" y="116" width="188" height="32" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="137" font-size="14" font-weight="600" fill="#b91c1c" text-anchor="middle">« C'est moi la box »</text>

  <rect x="226" y="168" width="188" height="88" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <rect x="292" y="180" width="56" height="32" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/><line x1="284" y1="216" x2="356" y2="216" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="320" y="242" font-size="15" font-weight="600" fill="#0b1220" text-anchor="middle">Appareil d'un tiers</text>

  <path d="M112 166 C112 210 160 212 220 212" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#l-red)"/>
  <path d="M420 212 C480 212 528 210 528 168" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#l-red)"/>
</svg>
