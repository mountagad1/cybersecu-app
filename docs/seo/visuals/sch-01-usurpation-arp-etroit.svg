<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" role="img" aria-labelledby="sch01e-title" font-family="Inter, system-ui, sans-serif">
  <title id="sch01e-title">Schéma : sur un même réseau local, l'appareil d'un tiers répond « c'est moi la box » ; votre téléphone lui envoie alors son trafic, qu'il relaie vers la vraie box.</title>
  <!-- Pilote de direction artistique (docs/seo/ART_DIRECTION.md), variante étroite (< 480 px). Non publié. -->
  <defs>
    <marker id="e-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <marker id="e-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="6" y="6" width="308" height="448" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="160" y="32" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Même réseau local</text>

  <rect x="24" y="48" width="170" height="78" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <rect x="93" y="58" width="30" height="40" rx="6" fill="none" stroke="#2563eb" stroke-width="2"/><circle cx="108" cy="91" r="2.5" fill="#2563eb"/>
  <text x="109" y="116" font-size="15" font-weight="600" fill="#0b1220" text-anchor="middle">Votre téléphone</text>

  <rect x="24" y="190" width="170" height="80" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <rect x="82" y="200" width="52" height="30" rx="4" fill="none" stroke="#dc2626" stroke-width="2"/><line x1="74" y1="234" x2="142" y2="234" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="109" y="258" font-size="15" font-weight="600" fill="#0b1220" text-anchor="middle">Appareil d'un tiers</text>
  <rect x="24" y="148" width="170" height="30" rx="15" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="109" y="168" font-size="13" font-weight="600" fill="#b91c1c" text-anchor="middle">« C'est moi la box »</text>

  <rect x="24" y="346" width="170" height="90" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <rect x="79" y="368" width="60" height="26" rx="5" fill="none" stroke="#0f766e" stroke-width="2"/><circle cx="93" cy="381" r="3" fill="#0f766e"/>
  <line x1="89" y1="368" x2="83" y2="356" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/><line x1="129" y1="368" x2="135" y2="356" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
  <text x="109" y="424" font-size="15" font-weight="600" fill="#0b1220" text-anchor="middle">La vraie box</text>

  <path d="M200 87 C278 87 278 391 200 391" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#e-grey)"/>
  <text x="292" y="243" font-size="13" fill="#475569" text-anchor="middle" transform="rotate(90 292 243)">Trajet prévu</text>

  <path d="M60 128 L60 142" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#e-red)"/>
  <path d="M109 272 L109 340" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#e-red)"/>
</svg>
